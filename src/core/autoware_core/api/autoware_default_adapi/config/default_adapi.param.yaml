/adapi/node/localization:
  ros__parameters:
    diagnostic_updater:
      period: 1.0
      use_fqn: true

/adapi/node/routing:
  ros__parameters:
    stop_check_duration: 1.0
    diagnostic_updater:
      # Publish at 5 Hz so the diagnostic graph's 3 s timeout has scheduling margin.
      period: 0.2
      use_fqn: true
