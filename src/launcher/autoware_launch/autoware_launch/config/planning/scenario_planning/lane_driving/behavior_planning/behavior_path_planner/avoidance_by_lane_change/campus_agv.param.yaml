/**:
  ros__parameters:
    avoidance_by_lane_change:
      campus_agv: true
      execute_object_longitudinal_margin: 0.0
      execute_only_when_lane_change_finish_before_object: false

      # Closed-site opposite borrowing: approve the complete outgoing and return maneuver.
      enable_opposite_lane_borrowing: true
      opposite_lane:
        attention_distance: 50.0
        candidate_speeds: [2.0, 1.5, 1.0, 0.5]
        static_speed_threshold: 1.0
        static_observation_time: 0.5
        max_speed: 2.0
        max_prediction_horizon: 60.0
        time_resolution: 0.5
        min_time_gap: 1.0
        longitudinal_margin: 1.0
        lateral_margin: 0.1
        clearance_hold_time: 0.0
        return_distance_after_object: 5.0
        data_timeout: 5.0
        max_planning_time_ms: 5000.0
        prepare_distance: 3.0
        min_shift_distance: 5.0
        max_return_extension_distance: 100.0
        return_extension_step: 1.0
        road_boundary_margin: 0.1
        execution_position_tolerance_m: 0.75
        execution_yaw_tolerance_rad: 0.3
        history_position_jump_tolerance_m: 2.5
        history_time_distance_margin_m: 0.75
        kinematic_curvature_tolerance_ratio: 1.2
        kinematic_jerk_tolerance_ratio: 1.2
      trailer:
        # Static configuration used at startup; a vehicle message overrides it.
        # Set count to 0 for an unhitched tractor, or list attached types front to rear.
        count: 0
        ordered_types: [default]
        configuration_topic: /vehicle/status/trailer_configuration
        tractor_rear_axle_to_hitch: 0.6
        type_names: [default, wide, articulation]
        types:
          default:
            width: 1.305
            axle_to_body_front: 1.0
            axle_to_body_rear: 0.7
            front_hitch_to_axle: 0.9
            axle_to_rear_hitch: 0.6
            max_articulation_angle_deg: 45.0
          wide:
            width: 3.0
            axle_to_body_front: 1.0
            axle_to_body_rear: 0.7
            front_hitch_to_axle: 0.9
            axle_to_rear_hitch: 0.6
            max_articulation_angle_deg: 45.0
          articulation:
            width: 1.305
            axle_to_body_front: 1.0
            axle_to_body_rear: 0.7
            front_hitch_to_axle: 0.9
            axle_to_rear_hitch: 0.6
            max_articulation_angle_deg: 10.0

      # avoidance is performed for the object type with true
      target_object:
        car:
          th_moving_speed: 0.4                         # [m/s]
          th_moving_time: 1.0                          # [s]
          max_expand_ratio: 0.0                        # [-]
          envelope_buffer_margin: 0.0                  # [m]
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.2                           # [m]
            hard_margin_for_parked_vehicle: 0.2        # [m]
        truck:
          th_moving_speed: 0.4                         # [m/s]
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.0
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.2                           # [m]
            hard_margin_for_parked_vehicle: 0.2        # [m]
        bus:
          th_moving_speed: 0.4                         # [m/s]
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.0
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.2                           # [m]
            hard_margin_for_parked_vehicle: 0.2        # [m]
        trailer:
          th_moving_speed: 0.4                         # [m/s]
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.0
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.2                           # [m]
            hard_margin_for_parked_vehicle: 0.2        # [m]
        unknown:
          th_moving_speed: 0.4                         # [m/s]
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.0
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.2                           # [m]
            hard_margin_for_parked_vehicle: 0.2        # [m]
        bicycle:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        motorcycle:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        pedestrian:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        lower_distance_for_polygon_expansion: 0.0      # [m]
        upper_distance_for_polygon_expansion: 1.0      # [m]

      # For target object filtering
      target_filtering:
        # avoidance target type
        target_type:
          car: true                                    # [-]
          truck: true                                  # [-]
          bus: true                                    # [-]
          trailer: true                                # [-]
          unknown: true                                # [-]
          bicycle: false                               # [-]
          motorcycle: false                            # [-]
          pedestrian: false                            # [-]
