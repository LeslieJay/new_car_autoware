/**:
  ros__parameters:
    trajectory_checker:
      interval:
        enable: true
        threshold: 2.0
      curvature:
        enable: true
        threshold: 0.8
      relative_angle:
        enable: true
        threshold: 2.0 # (= 115 degree)
      lateral_accel:
        enable: true
        threshold: 0.8
      min_lon_accel:
        enable: true
        # 与 planning limit.min_acc=-2.4 m/s^2 对齐，并为离散轨迹计算保留
        # 0.3 m/s^2 瞬态余量。
        threshold: -2.7
      max_lon_accel:
        enable: true
        threshold: 1.2
      lateral_jerk:
        enable: true
        threshold: 2.0
      steering:
        enable: true
        threshold: 0.70
      steering_rate:
        enable: true
        threshold: 1.0
      distance_deviation:
        enable: true
        # 不使用乘用车默认的近似关闭值；2.0 m 可容忍低速绕障跟踪误差，
        # 同时仍能拦截本次 LC 回正阶段超过 3 m 的实际偏离。
        threshold: 2.0
      lon_distance_deviation:
        enable: true
        threshold: 1.0
      velocity_deviation:
        enable: true
        # 宽松仿真验收：允许 LC 输出切换时从 2 m/s 轨迹短暂降速，不因单帧
        # 速度重规划触发 MRM；几何偏差、加速度和轨迹连续性检查仍保持启用。
        threshold: 2.5
      yaw_deviation:
        enable: true
        threshold: 1.5708 # (= 90 degrees)
        th_trajectory_yaw_shift: 0.1  # [rad] yaw deviation is only checked if the nearest yaw jumped by more than this value between the previous and current trajectory
      forward_trajectory_length:
        enable: true
        acceleration: -3.0
        margin: 2.0
      trajectory_shift:
        enable: true
        lat_shift_th: 0.5
        forward_shift_th: 1.0
        backward_shift_th: 0.1
        handling_type: 0  # always publish the current trajectory, even when invalid
        override_error_diag: false
