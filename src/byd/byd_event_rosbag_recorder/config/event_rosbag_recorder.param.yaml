event_rosbag_recorder_node:
  ros__parameters:
    recording:
      pre_trigger_seconds: 30.0
      post_trigger_seconds: 30.0
      segment_seconds: 5.0
      max_event_duration_seconds: 600.0
      # Sized for roughly two minutes at the observed aggregate rate of 600 msg/s,
      # with additional headroom for short diagnostic bursts.
      queue_capacity_messages: 80000
    topics:
      names:
        - /vehicle/status/velocity_status
        - /control/trajectory_follower/control_cmd
        - /control/command/control_cmd
        - /event_rosbag_recorder/status
      # Omit include_regex when unused; ROS 2 Humble cannot infer the type of [].
      exclude_regex:
        - ^/debug/
    diagnostics:
      min_level: 2
      include_names:
        - .*
      exclude_names:
        - ^event_rosbag_recorder($|:)
        - ^system_event_monitor($|:)
      trigger_on_transition: true
    storage:
      output_directory: /home/nvidia/autoware/log
      temporary_directory: /home/nvidia/autoware/log/.buffer
      minimum_free_space_gb: 20.0
      maximum_event_storage_gb: 200.0
      cleanup_policy: oldest_first
      storage_id: mcap
      compression: zstd
