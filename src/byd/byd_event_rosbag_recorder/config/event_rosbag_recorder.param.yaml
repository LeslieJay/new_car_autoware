event_rosbag_recorder_node:
  ros__parameters:
    recording:
      pre_trigger_seconds: 30.0
      post_trigger_seconds: 30.0
      segment_seconds: 5.0
      max_event_duration_seconds: 600.0
      # Re-evaluate this bound against the aggregate rate of the configured topics,
      # especially when point-cloud topics are enabled.
      queue_capacity_messages: 400000
    topics:
      # Keep this selection aligned with scripts/rosbag_record_command.sh.
      include_regex:
        - ^/planning($|/)|^/control($|/)|^/vehicle($|/)|^/simulation($|/)|^/localization($|/)|^/system($|/)|^/diagnostics($|/)|^/perception/object_recognition/objects$|^/perception/object_recognition/tracking/objects$|^/perception/object_recognition/detection/lidar_rule/objects$|^/perception/object_recognition/detection/lidar_dnn/objects$|^/perception/object_recognition/detection/merged/objects$|^/perception/object_recognition/detection/objects$|^/perception/occupancy_grid_map/map$|^/perception/obstacle_segmentation/pointcloud$|^/tf$|^/tf_static$|^/clock$|^/sensing/lidar/concatenated/pointcloud$|^/sensing/imu/imu_data$
      # Omit names when unused; ROS 2 Humble cannot infer the type of [].
      exclude_regex:
        - ^/debug/
    triggers:
      event_topic_enabled: true
      allowed_event_types:
        - abnormal_stop
        - autonomous_to_manual
      diagnostics_enabled: false
      service_enabled: false
    diagnostics:
      min_level: 2
      include_names:
        - .*
      exclude_names:
        - ^event_rosbag_recorder($|:)
        - ^system_event_monitor($|:)
      trigger_on_transition: true
    storage:
      output_directory: /home/nvidia/autoware/log/event_rosbag
      temporary_directory: /home/nvidia/autoware/log/event_rosbag/.buffer
      minimum_free_space_gb: 20.0
      maximum_event_storage_gb: 200.0
      cleanup_policy: oldest_first
      storage_id: mcap
      compression: zstd
