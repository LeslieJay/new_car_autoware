/**:
  ros__parameters:
    pointcloud:
      enable_check: false
      # At 2 m/s and -1.2 m/s^2, ideal braking distance is 1.67 m.
      # 0.5 m includes processing/control delay and a conservative reserve.
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    unknown:
      enable_check: true
      # This node only intervenes after ego is stopped. Use a smaller UNKNOWN-only envelope so a
      # boundary object cannot latch the command gate after obstacle_stop has cleared it.
      surround_check_front_distance: 0.25
      surround_check_side_distance: 0.25
      surround_check_back_distance: 0.25
    car:
      enable_check: false
      surround_check_front_distance: 0.0
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    truck:
      enable_check: false
      surround_check_front_distance: 0.0
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    bus:
      enable_check: false
      surround_check_front_distance: 0.0
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    trailer:
      enable_check: false
      surround_check_front_distance: 0.0
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    motorcycle:
      enable_check: false
      surround_check_front_distance: 0.0
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    bicycle:
      enable_check: false
      surround_check_front_distance: 0.0
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5
    pedestrian:
      enable_check: true
      surround_check_front_distance: 0.5
      surround_check_side_distance: 0.5
      surround_check_back_distance: 0.5

    surround_check_hysteresis_distance: 0.1
    state_clear_time: 0.3
    stop_state_ego_speed: 0.1
    # Protect both lane driving and the custom reverse planner while moving.
    stop_only_when_stopped: true
    fail_safe_on_data_timeout: false
    data_timeout_sec: 0.5
    request_command_gate_stop: true
    stop_request_source: "byd_pedestrian_safety_stop"

    publish_debug_footprints: true
    debug_footprint_label: "pedestrian"
