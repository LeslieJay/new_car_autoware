/**:
  ros__parameters:
    avoidance_by_lane_change:
      execute_object_longitudinal_margin: 80.0
      execute_only_when_lane_change_finish_before_object: false

      # Closed-site opposite borrowing: approve the complete outgoing and return maneuver.
      enable_opposite_lane_borrowing: false
      opposite_lane:
        max_speed: 2.0
        max_prediction_horizon: 30.0
        time_resolution: 0.5
        min_time_gap: 3.0
        longitudinal_margin: 2.0
        lateral_margin: 0.5
        clearance_hold_time: 1.0
        return_distance_after_object: 5.0
        data_timeout: 0.5
        max_planning_time_ms: 50.0
        prepare_distance: 3.0
        min_shift_distance: 5.0
        road_boundary_margin: 0.1
      trailer:
        # A latched empty configuration explicitly identifies an unhitched tractor.
        configuration_topic: /vehicle/status/trailer_configuration
        tractor_rear_axle_to_hitch: 0.6
        type_names: [default, wide, articulation]
        types:
          default:
            width: 1.305
            axle_to_body_front: 1.0
            axle_to_body_rear: 0.7
            front_hitch_to_axle: 0.9
            axle_to_rear_hitch: 0.6
            max_articulation_angle_deg: 45.0
          wide:
            width: 3.0
            axle_to_body_front: 1.0
            axle_to_body_rear: 0.7
            front_hitch_to_axle: 0.9
            axle_to_rear_hitch: 0.6
            max_articulation_angle_deg: 45.0
          articulation:
            width: 1.305
            axle_to_body_front: 1.0
            axle_to_body_rear: 0.7
            front_hitch_to_axle: 0.9
            axle_to_rear_hitch: 0.6
            max_articulation_angle_deg: 10.0

      # avoidance is performed for the object type with true
      target_object:
        car:
          th_moving_speed: 1.0                         # [m/s]
          th_moving_time: 1.0                          # [s]
          max_expand_ratio: 0.0                        # [-]
          envelope_buffer_margin: 0.3                  # [m]
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        truck:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        bus:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        trailer:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        unknown:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 0.0                           # [m]
            hard_margin_for_parked_vehicle: 0.0        # [m]
        bicycle:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        motorcycle:
          th_moving_speed: 1.0                         # 3.6km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        pedestrian:
          th_moving_speed: 0.28                        # 1.0km/h
          th_moving_time: 1.0
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.8
          lateral_margin:
            soft_margin: 0.0                           # [m]
            hard_margin: 1.0                           # [m]
            hard_margin_for_parked_vehicle: 1.0        # [m]
        lower_distance_for_polygon_expansion: 0.0      # [m]
        upper_distance_for_polygon_expansion: 1.0      # [m]

      # For target object filtering
      target_filtering:
        # avoidance target type
        target_type:
          car: true                                    # [-]
          truck: true                                  # [-]
          bus: true                                    # [-]
          trailer: true                                # [-]
          unknown: true                                # [-]
          bicycle: false                               # [-]
          motorcycle: false                            # [-]
          pedestrian: false                            # [-]
