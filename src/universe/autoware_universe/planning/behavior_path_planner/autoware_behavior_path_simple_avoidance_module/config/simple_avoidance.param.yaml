/**:
  ros__parameters:
    simple_avoidance:
      th_moving_speed: 0.5
      min_forward_distance: 0.5
      max_forward_distance: 60.0
      lateral_margin: 0.4
      max_shift_length: 4.0
      # PathShifter 要求 end_idx - start_idx > 1；参考路径按 1m 重采样，
      # 侧移段至少留足若干米，避免 path_generation_failed
      min_prepare_distance: 5.0
      min_shifting_distance: 10.0
      shifting_lateral_jerk: 0.5
      min_shifting_speed: 1.0
      return_distance_after_object: 5.0
      target_lost_time_threshold: 1.0
      target_hold_lateral_hysteresis: 0.3
      lateral_execution_threshold: 0.05
      path_generation_failure_timeout: 0.5
      completion_stable_count: 3
      trailer:
        configuration_topic: /vehicle/status/trailer_configuration
        tractor_rear_axle_to_hitch: 0.60
        footprint_sampling_interval: 0.50
        lateral_search_resolution: 0.10
        return_search_resolution: 0.50
        max_extra_return_distance: 20.0
        max_planning_time_ms: 20.0
        stationary_speed_threshold: 0.05
        type_names: [default]
        types:
          # Example dimensions for simulation only. Replace with measured values before vehicle use.
          default:
            width: 1.305
            axle_to_body_front: 1.00
            axle_to_body_rear: 0.70
            front_hitch_to_axle: 0.90
            axle_to_rear_hitch: 0.60
            max_articulation_angle_deg: 45.0
      publish_debug_marker: true
